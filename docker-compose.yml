services:
  postgres:
    image: postgres:17-alpine
    container_name: achichiz-postgres
    environment:
      POSTGRES_USER: achichiz
      POSTGRES_PASSWORD: achichiz
      POSTGRES_DB: achichiz
    ports:
      - '5432:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U achichiz -d achichiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: achichiz-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound email in development. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: achichiz-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible stand-in for Cloudflare R2. Console at http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: achichiz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.docker-data/minio:/data
